<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <meta name="description" content="Daymark is a calm, calendar-first planner for your studies, projects, and practice.">
  <title>Daymark — Personal planner</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <div class="workspace">
      <header class="topbar">
        <a href="./" class="brand" aria-label="Daymark home">
          <img src="mark.svg" alt="" width="32" height="32">
          <span>daymark<span class="brand-period">.</span></span>
        </a>
        <nav class="navigation" aria-label="Planner views">
          <button class="nav-button active" data-view="calendar" aria-current="page"><span data-icon="calendar"></span>Planner</button>
          <button class="nav-button" data-view="tasks"><span data-icon="list"></span>All tasks</button>
        </nav>
        <div class="top-actions">
          <button class="button search-button" id="search-button"><span data-icon="search"></span><span>Search</span><kbd>/</kbd></button>
          <button class="button primary" id="new-task"><span data-icon="plus"></span>New task</button>
        </div>
      </header>
      <main>
        <section class="planner-heading" aria-labelledby="page-title">
          <h1 id="page-title">Planner</h1>
          <section class="category-nav" aria-label="Filter by category">
            <div id="categories"></div>
          </section>
        </section>

        <div class="planner" id="calendar-view">
          <section class="calendar-card panel" aria-labelledby="month-heading">
            <div class="calendar-toolbar">
              <h2 id="month-heading" aria-live="polite"></h2>
              <div class="month-actions">
                <div class="view-switch" aria-label="Calendar layout" role="group">
                  <button data-layout="month" aria-pressed="true">Month</button>
                  <button data-layout="week" aria-pressed="false">Week</button>
                </div>
                <button class="button today-button" id="today-button">Today</button>
                <button class="button icon-button" id="prev-month" aria-label="Previous month"><span data-icon="chevronLeft"></span></button>
                <button class="button icon-button" id="next-month" aria-label="Next month"><span data-icon="chevronRight"></span></button>
              </div>
            </div>
            <div class="weekdays" aria-hidden="true"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
            <div class="calendar-grid" id="calendar-grid" aria-label="Calendar dates"></div>
            <footer class="calendar-footer"><span><span class="today-key"></span>Today</span><span><span class="selected-key"></span>Selected</span></footer>
          </section>
          <aside class="day-column" aria-label="Selected day">
            <section class="agenda panel" aria-labelledby="agenda-heading">
              <header class="agenda-header" id="agenda-header">
                <div>
                  <p class="eyebrow" id="agenda-weekday"></p>
                  <h2 id="agenda-heading"></h2>
                </div>
                <button class="button icon-button agenda-add" id="agenda-add" aria-label="Add task for selected date"><span data-icon="plus"></span></button>
              </header>
              <div class="day-progress">
                <div class="progress-label"><span>Daily progress</span><strong id="progress-label"></strong></div>
                <progress id="daily-progress" max="1" value="0" aria-label="Daily progress"></progress>
              </div>
              <div class="agenda-list" id="agenda-list"></div>
              <button class="add-row" id="add-row"><span data-icon="plus"></span> Add a task</button>
            </section>
            <section class="week-note panel" aria-labelledby="week-heading">
              <div class="week-note-head"><p class="eyebrow" id="week-heading">WEEK IN REVIEW</p><p class="week-caption" id="week-caption"></p></div>
              <p class="week-count" id="week-count"></p>
              <div class="week-strip" id="week-strip" aria-label="Daily completion this week"></div>
            </section>
          </aside>
        </div>

        <section class="panel task-library" id="tasks-view" aria-label="All tasks" hidden>
          <div class="library-toolbar">
            <label class="library-search"><span data-icon="search"></span><input type="search" id="task-search" placeholder="Search tasks, labels, or notes" aria-label="Search tasks"></label>
            <label class="status-label">Status <select id="status-filter"><option value="all">All</option><option value="open">Open</option><option value="done">Completed</option></select></label>
          </div>
          <p class="library-note" id="library-note" hidden>Each repeating task appears once here. Open the calendar to see every occurrence.</p>
          <div id="library-list"></div>
        </section>
        <footer class="workspace-footer"><div class="workspace-tools"><span>Saved in this browser</span><button id="clear-demo" class="clear-demo" hidden>Remove sample tasks</button></div><span class="shortcut-hint"><kbd>N</kbd> New task <kbd>/</kbd> Search</span></footer>
      </main>
    </div>
  </div>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form">
      <header class="dialog-header"><div><p class="eyebrow">DAYMARK TASK</p><h2 id="dialog-title">New task</h2></div><button class="button icon-button" id="close-dialog" type="button" aria-label="Close dialog"><span data-icon="x"></span></button></header>
      <label class="field">Task name<input name="title" required maxlength="100" placeholder="What needs doing?" autofocus></label>
      <div class="form-pair">
        <label class="field"><span id="task-date-label">Date</span><input type="date" name="date" min="0001-01-01" max="9999-12-31" required></label>
        <label class="field">Category<select name="category" id="task-category"></select></label>
      </div>
      <div class="repeat-fields">
        <div class="form-pair">
          <label class="field">Repeat<select name="repeat" aria-describedby="repeat-detail"><option value="">Once</option><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Every week</option></select></label>
          <label class="field" id="repeat-end" hidden>End date <span class="optional">optional</span><input name="until" type="date" max="9999-12-31" disabled></label>
        </div>
        <p id="repeat-detail" class="repeat-detail" hidden></p>
      </div>
      <div class="form-pair">
        <label class="field">Label <span class="optional">optional</span><input name="label" maxlength="32" placeholder="e.g. Exam prep"></label>
        <label class="field">Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option></select></label>
      </div>
      <fieldset class="task-colors">
        <legend>Task color</legend>
        <div id="color-options" class="color-options"></div>
      </fieldset>
      <label class="field">Notes <span class="optional">optional</span><textarea name="notes" rows="3" maxlength="1000" placeholder="Add a detail to remember"></textarea></label>
      <div class="dialog-actions">
        <button type="button" id="delete-task" class="button danger" hidden><span data-icon="trash"></span>Delete</button>
        <button type="button" id="skip-task" class="button" hidden>Skip this date</button>
        <button type="button" id="cancel-dialog" class="button">Cancel</button>
        <button class="button primary" id="save-task">Add task</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Daymark needs JavaScript to display your calendar and save tasks.</p></noscript>
</body>
</html>
